name: Build Better AIM

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Install Gradle 8.14 and generate the wrapper JAR so ./gradlew works
      # even when gradle-wrapper.jar is not committed to the repository.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2'

      - name: Generate Gradle wrapper JAR
        run: gradle wrapper --gradle-version 9.2

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: better-aim-${{ github.run_number }}
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          retention-days: 30

      - name: Upload sources JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: better-aim-sources-${{ github.run_number }}
          path: build/libs/*-sources.jar
          retention-days: 30
